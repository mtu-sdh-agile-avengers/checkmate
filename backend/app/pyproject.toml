[project]
name = "checkmate-backend"
version = "0.6.0"
description = "..."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.165.0",
    "httpx[brotli,http2,zstd]>=0.28.1",
    "loguru==0.8.0",
    "pydantic>=2.14.1",
    "pydantic-core==2.50.4",
    "pydantic-settings==2.16.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.5",
]


# fastapi configuration
[tool.fastapi]
entrypoint = "src.main:app" # allows `fastapi` command  where to find FastAPI instance (`app` object) without explicitly specifying path

# pytest configuration
[tool.pytest.ini_options]
pythonpath = [".", "src"]   # required in order for imports to work (adds root  and .src folders to sys.path)
testpaths = ["tests"]       # specifies tests directory location for pytest
